name: anythingllm

services:
  # A 股服务仅在内部网络开放；Fuyao Key 只注入此容器。
  ashare-service:
    build:
      context: ../ashare-service
      dockerfile: Dockerfile
    env_file:
      - ../ashare-service/.env
    environment:
      ASHARE_SERVICE_TOKEN: ${ASHARE_SERVICE_TOKEN:?请在 docker/.env 中设置内部令牌}
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ../ashare-service/storage:/app/storage
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request
          urllib.request.urlopen("http://127.0.0.1:8765/health", timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - anything-llm
    restart: unless-stopped

  anything-llm:
    container_name: anythingllm
    build:
      context: ../.
      dockerfile: ./docker/Dockerfile
      args:
        ARG_UID: ${UID:-1000}
        ARG_GID: ${GID:-1000}
    depends_on:
      ashare-service:
        condition: service_healthy
    cap_add:
      - SYS_ADMIN
    env_file:
      - .env
    environment:
      ASHARE_SERVICE_URL: http://ashare-service:8765
      ASHARE_SERVICE_TOKEN: ${ASHARE_SERVICE_TOKEN:?请在 docker/.env 中设置内部令牌}
    volumes:
      - ./.env:/app/server/.env
      - ../server/storage:/app/server/storage
      - ../collector/hotdir:/app/collector/hotdir
      - ../collector/outputs:/app/collector/outputs
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "3001:3001"
    networks:
      - anything-llm
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

networks:
  anything-llm:
    driver: bridge
